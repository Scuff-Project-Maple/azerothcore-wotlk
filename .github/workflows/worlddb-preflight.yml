name: World DB pre-flight

# The three checks that answer "did a change to the write-policy engine, or to the SQL
# it governs, just start refusing syntax it must accept" — the question the boot gate
# cannot answer, because it only policy-checks files the updater has not applied yet.
# Everything here is pure Python against the checkout: no MySQL, no Docker, no deploy
# host. A step that needed one of those would not belong in this workflow.
#
# What gates and what only reports is written out in ops/preflight/README.md
# ("In CI"). In one line: findings in the `company` provenance column fail the check,
# the `upstream` columns are measured and reported and never fail it, and a run whose
# provenance could not be attributed fails rather than passing quietly.
#
# Do not mark either job as a required status check on this repo. Both triggers are
# `paths:`-filtered, so a PR that touches neither `ops/preflight/**` nor `data/sql/**`
# never starts a run, and a required check that never starts is "Expected — waiting"
# forever: every ordinary PR would be unable to merge (PRO-295 review N2). The check is
# meant to be read, and it is a real gate because a violating PR cannot hide the red.
# If a branch-protection rule is ever wanted, it goes on a branch that only ever carries
# in-scope changes, or this filter moves to `paths-ignore` of the unrelated trees.
#
# PRO-441 is why the sentence above ends in "meant to be read" rather than "is the gate":
# this file was dead silently for four days. Actions had been disabled for the repository
# from above while `GET /repos/.../actions/permissions` still answered `enabled: true`, so
# nothing here ran on any branch — and nothing here could have said so, because a workflow
# cannot report its own non-execution. That is what makes "read the check" something the
# hand that merges has to do by hand: run ops/preflight/ci_liveness_guard.py for the
# commit being merged (ops/preflight/README.md, "Liveness: the run that never existed").
# It separates green, red, unscheduled and absent, and it refuses to call the last one a
# pass. Do not answer a liveness failure by editing this file. The YAML was never the
# cause, `paths:` was never the cause, and the fix for `NOT RUNNING` is a toggle that sits
# above this repository.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ops/preflight/**
      - data/sql/**
      - .github/workflows/worlddb-preflight.yml
  push:
    # The same sweep on the branch itself (PRO-295 review N1). A merge that lands on
    # Playerbot through a path that never opened a PR — a direct push, a rebase-and-merge
    # of a stale head, a revert — otherwise carries the engine change with no sweep at
    # all, which is precisely the state PRO-285 was written to end.
    branches:
      - Playerbot
    paths:
      - ops/preflight/**
      - data/sql/**
      - .github/workflows/worlddb-preflight.yml
  workflow_dispatch: {}

concurrency:
  # New commits on a PR cancel the still-running check on the old commit. github.ref
  # is refs/pull/<N>/merge for a PR and refs/heads/<branch> for a push, so the group is
  # stable per PR, and a push to Playerbot never shares a group with a PR run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-engine:
    runs-on: ubuntu-latest
    name: Write policy — engine tests and schema audit
    timeout-minutes: 10
    # No `github.repository == ...` guard on purpose: a guard that names the wrong
    # repository makes the check stop existing rather than fail, and a check that never
    # runs is the exact failure mode this workflow exists to close (PRO-285).
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Write-policy unit tests
        # ~0.5 s, no DB. Plain `python3 -m unittest discover -s ops/preflight` does not
        # work: the directory is not a package.
        run: python3 ops/preflight/test_preflight_worlddb.py
      - name: Policy tables vs the real DDL
        # Checks every baseTables/customTables column against data/sql/base/db_world and
        # the module SQL that creates the custom tables. Discovers module DDL with
        # `git ls-files`, so it needs a checkout and nothing else.
        run: python3 ops/preflight/audit_policy_schema.py --include-modules

  corpus-sweep:
    runs-on: ubuntu-latest
    name: Write policy — corpus sweep (company column gates, upstream columns report)
    # Measured 4m32s on a 6-core box with the default 8 workers, ~6 min on 4 workers.
    # The per-file `git log` author lookups dominate, so the budget is history-bound.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Provenance is read from `git log -1 -- <path>` per file. A partial history
          # does not return empty: a grafted root makes every path resolve to the tip
          # commit, so all 3 060 files inherit the tip author. Measured on a --depth 1
          # clone, that put 444 726 findings in one column — `company` if the tip is
          # ours (loud red, useless), `upstream` if the tip is a merge commit (silently
          # green, which is the one that matters). Nothing in the tally says `unknown`
          # while this happens. The guard step below is what detects it; the full fetch
          # is what stops it.
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Whole-corpus write policy
        # The gate. Exits 1 on any finding in the `company` column and prints each one
        # as file:line: rule. Reproduce locally from a checkout of the PR head with the
        # identical command:
        #   python3 ops/preflight/corpus_sweep.py --strict-all --out /tmp/corpus-sweep.json
        run: >-
          python3 ops/preflight/corpus_sweep.py --strict-all
          --out "$RUNNER_TEMP/corpus-sweep.json"
      - name: Provenance attribution guard
        if: ${{ !cancelled() }}
        # Second half of the gate: refuses a tally that could not attribute the files it
        # scanned, so a green company column cannot come from a checkout that has no
        # history to read. It runs after a red sweep on purpose — a collapse in the
        # `company` column looks exactly like a genuine policy violation, and the run
        # that just went red is the run where "is this verdict real" still has to be
        # answered. Without `!cancelled()` this step is skipped the moment the sweep
        # fails, which is what it did on the first run of the self-test PR (PRO-285).
        # The sweep writes the tally before it exits, so there is a file to read either
        # way; if there is not one, the guard exits 1 rather than shrugging.
        run: python3 ops/preflight/ci_provenance_guard.py "$RUNNER_TEMP/corpus-sweep.json"
